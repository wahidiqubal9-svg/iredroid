name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Writes a release keystore + key.properties from repository secrets so
      # that every build is signed with the same key (required for OTA updates).
      # If the secrets are not set, the release falls back to the debug key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
              printf 'keyAlias=%s\n'      "$KEY_ALIAS"
              printf 'storeFile=upload-keystore.jks\n'
            } > android/key.properties
          else
            echo "No KEYSTORE_BASE64 secret found; signing with the debug key."
          fi

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build release APKs
        run: |
          # Split APKs get ABI version-code offsets (arm64 = +2000, etc.).
          # Give the universal APK a higher base so it can update an install
          # made from any of the split APKs without being rejected as a downgrade.
          UNIVERSAL_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "UNIVERSAL_VERSION_CODE=$UNIVERSAL_VERSION_CODE" >> "$GITHUB_ENV"
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION_NAME" --build-number=${GITHUB_RUN_NUMBER}
          flutter build apk --release \
            --build-name="$VERSION_NAME" --build-number="$UNIVERSAL_VERSION_CODE"

      # Publishes the universal APK to the apk branch, which gives a stable
      # direct download URL and the version.json consumed by the in-app updater.
      - name: Publish direct APK link (apk branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
          TMP="$(mktemp -d)"
          cd "$TMP"
          git init -q
          git checkout -q -b apk
          cp "$APK" iredroid.apk
          SHA="$(sha256sum iredroid.apk | cut -d' ' -f1)"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://raw.githubusercontent.com/%s/apk/iredroid.apk","sha256":"%s","notes":"Build %s"}\n' \
            "${UNIVERSAL_VERSION_CODE}" "$VERSION_NAME" "$GITHUB_REPOSITORY" "$SHA" "${GITHUB_RUN_NUMBER}" > version.json
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "CI build ${GITHUB_RUN_NUMBER} (v${VERSION_NAME})"
          git -c credential.helper= push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk:apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: IReDroid ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
